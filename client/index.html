<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Social/link previews. og:image must be an ABSOLUTE https URL to a
         JPEG/PNG: scrapers (iMessage, Facebook, X) don't resolve relative
         paths and handle WebP poorly. The og:image:* properties attach to the
         og:image directly above them, so keep them in this order. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.glendamacatangay.com/" />
    <meta property="og:site_name" content="Glenda Macatangay" />
    <meta property="og:title" content="Glenda Macatangay" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="https://www.glendamacatangay.com/opengraph.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Glenda Macatangay" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glenda Macatangay" />
    <meta name="twitter:description" content="" />
    <meta name="twitter:image" content="https://www.glendamacatangay.com/opengraph.jpg" />

    <!-- Icons are square, opaque PNG/ICO served from the site root. A real
         favicon.ico matters because browsers request /favicon.ico directly,
         and the SPA catch-all rewrite would otherwise answer it with HTML. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://assets.calendly.com/assets/external/widget.js" type="text/javascript" async></script>
    <link href="https://assets.calendly.com/assets/external/widget.css" rel="stylesheet">
  </body>
</html>
